name: Django CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Codecov uploads with GitHub's OIDC identity, so there is no token to
      # store or rotate. See use_oidc below.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # Django 6.0 requires Python 3.12+, so the matrix is explicit
        # rather than a full cross-product.
        include:
          - python-version: "3.11"
            django-version: "5.2"
          - python-version: "3.12"
            django-version: "5.2"
          - python-version: "3.13"
            django-version: "6.0"
          - python-version: "3.14"
            django-version: "6.0"

    name: Python ${{ matrix.python-version }} / Django ${{ matrix.django-version }}

    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[crypto]"
        pip install "Django~=${{ matrix.django-version }}.0" coverage

    - name: Check for missing migrations
      env:
        DJANGO_SETTINGS_MODULE: tests.test_settings
      run: python -m django makemigrations --check --dry-run

    - name: Run tests
      run: coverage run tests/runtests.py

    - name: Enforce full coverage
      # fail_under = 100 lives in .coveragerc, so this is the real gate.
      run: coverage report -m

    - name: Generate the coverage report for Codecov
      if: matrix.python-version == '3.13'
      run: coverage xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
      if: matrix.python-version == '3.13'
      with:
        disable_search: true
        fail_ci_if_error: true
        files: ./coverage.xml
        use_oidc: true

  docs:
    # Read the Docs builds the same way; failing here surfaces a broken build on
    # the pull request instead of after the merge.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: "3.13"

    - name: Check release version and documentation
      run: python scripts/check_release_docs.py

    - name: Install docs dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install -r docs/requirements.txt

    - name: Build the documentation, warnings are errors
      run: sphinx-build -W --keep-going -b html docs/source docs/_ci_build

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: paypal_checkout
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d paypal_checkout"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: "3.13"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install "Django~=6.0.0" "psycopg[binary]>=3.2"

    - name: Run PostgreSQL refund concurrency tests
      env:
        DJANGO_SETTINGS_MODULE: tests.test_settings
        PAYPAL_TEST_POSTGRES: "1"
        POSTGRES_DB: paypal_checkout
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
      run: python -m django test tests.test_refund_concurrency
