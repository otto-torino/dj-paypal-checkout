name: Publish to PyPI

on:
  push:
    branches: [ main ]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC token for PyPI Trusted Publishing
      contents: write   # create and push the version tag

    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      with:
        fetch-depth: 0   # full history so we can see existing tags

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: "3.13"

    - name: Read version from pyproject.toml
      id: version
      run: |
        VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Decide whether to publish
      id: tagcheck
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        if [ "$VERSION" = "0.0.0" ]; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
          echo "Version is the 0.0.0 placeholder — nothing released yet, skipping publish."
        elif git rev-parse "v$VERSION" >/dev/null 2>&1; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
          echo "Version v$VERSION already tagged — skipping publish."
        else
          echo "skip=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Build package
      if: steps.tagcheck.outputs.skip == 'false'
      run: |
        python -m pip install --upgrade pip build
        python -m build

    - name: Publish to PyPI
      if: steps.tagcheck.outputs.skip == 'false'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        skip-existing: true

    - name: Tag the released version
      if: steps.tagcheck.outputs.skip == 'false'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag -a "v${{ steps.version.outputs.version }}" -m "New version: v${{ steps.version.outputs.version }}"
        git push origin "v${{ steps.version.outputs.version }}"
